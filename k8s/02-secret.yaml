# IMPORTANT: the values below are obvious placeholders, publicly visible in this repo - never
# use them like this in a real cluster. For a real deployment, create this Secret out of band
# (kubectl create secret / a secret manager) with real values, then apply everything else here.
# Same convention and same reasoning as studylife's own k8s/01-config-and-secret.yaml.
#
# Bootstrap-only, NOT Flux-managed - kustomize-controller's ClusterRole (studylife repo's
# k8s/flux/06-reconciler-rbac.yaml) grants no permission on the "secrets" resource at all,
# deliberately (see the file's own header comment on least-privilege scoping). Applied once by
# hand (kubectl apply -f k8s/02-secret.yaml) with real values substituted first.
apiVersion: v1
kind: Secret
metadata:
  name: studylife-ai-secrets
  namespace: studylife-ai
type: Opaque
stringData:
  # Read directly by LiteLLM (OPENAI_API_KEY is its standard env var name, not something this
  # app's own config.py parses) - matches local dev (.env.example).
  OPENAI_API_KEY: "sk-REPLACE-ME"
  # LEGACY (audit A5, 2026-08-26) - kept only as a rollout fallback for
  # STUDYLIFE_TOKEN_SIGNING_SECRET/STUDYLIFE_INTERNAL_API_SECRET below (see .env.example and
  # docs/decisions.md "Split the shared secret (audit A5)"). Remove once both are set on BOTH
  # this service and StudyLife's own StudyLifeAi:TokenSigningSecret/InternalApiSecret.
  STUDYLIFE_SHARED_SECRET: "REPLACE-ME"
  # Verifies StudyLife-signed proxy tokens (see .env.example and docs/decisions.md "Split the
  # shared secret (audit A5)") - one or more comma-separated `kid:secret` entries, e.g.
  # `v1:REPLACE-ME`. MUST include whatever `kid` StudyLife's own StudyLifeAi:TokenSigningSecret
  # currently signs with (its FIRST entry) - every entry here is a valid verification key, so
  # rotation is: add a new entry here (and to StudyLife's own config, as its new first entry),
  # wait 5 minutes (the token lifetime), then remove the old entry from both.
  STUDYLIFE_TOKEN_SIGNING_SECRET: "v1:REPLACE-ME"
  # Authenticates POST /internal/* (see .env.example) - a plain static bearer, MUST match the
  # (single) value StudyLife's own StudyLifeAi:InternalApiSecret sends. May be a
  # comma-separated list of ACCEPTED values during a rotation (StudyLife always sends only the
  # first value from its own config).
  STUDYLIFE_INTERNAL_API_SECRET: "REPLACE-ME"
  # Encrypts every AiApiKey in REGISTERED_KEYS_DB_PATH at rest (audit finding A4, see
  # docs/decisions.md) - required, the app fails to start without a valid Fernet key here.
  # Generate with:
  #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  # May be a comma-separated list of Fernet keys (audit A13/F14 rest, via MultiFernet) - the
  # FIRST encrypts, ALL decrypt, enabling rotation (prepend a new key, keep the old one listed
  # until existing rows have been rewritten, then drop it) without a "big bang" re-encrypt
  # migration. Rotating by REPLACING (not prepending) the only key still makes every
  # already-encrypted row undecryptable (InvalidToken).
  AI_KEY_ENCRYPTION_KEY: "REPLACE-ME"
