name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a stuck/skipped release be manually re-flushed against the CURRENT tip of main (see
  # get-version's ref: main checkout below) - a plain "Re-run jobs" on an old push-triggered
  # run reuses that run's original, by-then-stale github.sha and can never succeed once main has
  # moved past it (found live 2026-08-21: two PRs merged ~5 minutes apart, the second push's
  # get-version dry run saw "local branch is behind the remote" and skipped semantic-release/
  # docker/trivy entirely - re-running that exact run kept failing the same way for that reason).
  workflow_dispatch:

# One queue entry per ref (or per PR number, so successive pushes to the same PR don't queue
# behind each other) - the whole run (lint/test/get-version/docker/trivy/semantic-release) is
# now a single atomic unit instead of several jobs independently competing for the same
# job-level lock (docs/decisions.md "eval split into its own workflow to fix the lint/test
# self-collision race"). Only PR runs get cancelled by a newer push to the same PR
# (fast feedback); a push-to-main run is never cancelled mid-flight, so a release can't be
# interrupted partway through.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/lukislp/studylife-ai

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.5.8"
          cache-suffix: "lint"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.5.8"
          cache-suffix: "test"
      - run: uv python install 3.12
      - run: uv sync --frozen
      # tests/contract/test_openapi_contract.py (audit finding D2/D3) is a normal part of this
      # `uv run pytest` - it's just another module under tests/. Called out here because it
      # behaves differently in CI than the rest of the suite: it fetches StudyLife's committed
      # OpenAPI spec (docs/api/openapi.json in the studylife repo, via the module's default
      # STUDYLIFE_OPENAPI_SPEC URL) and FAILS this job (not skips) if that spec is unreachable
      # or this repo's DTO mirrors/client.py have drifted from it - see that module's own
      # docstring for the full reachability policy (CI vs. local/offline dev).
      - run: uv run pytest

  # ---------------------------------------------------------------------
  # Version / image / release - push to main only (M5, mirrors studylife's
  # own ci-cd.yml pattern: semantic-release drives the version, Flux picks
  # up the resulting GHCR tag via ImagePolicy - see docs/decisions.md).
  # ---------------------------------------------------------------------
  get-version:
    needs: [lint, test]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # @semantic-release/github's verifyConditions step checks the token has repo push access
    # (contents: write) even during a dry run - a read-only token fails that check outright.
    # issues:write/pull-requests:write are NOT needed here: those only get exercised by the
    # publish/success/fail lifecycle steps, which dry_run: true skips entirely - confirmed
    # live (2026-08-12, docs/decisions.md).
    permissions:
      contents: write
    outputs:
      next_version: ${{ steps.semrel.outputs.new_release_version }}
      published: ${{ steps.semrel.outputs.new_release_published }}
    steps:
      # ref: main (branch tip), NOT the push-event SHA: Flux's image-update automation commits
      # "[skip ci]" bumps to main that can land between the triggering push and this job actually
      # running. semantic-release's "local branch is behind the remote" guard then analyzes a
      # stale SHA and releases nothing - the entire release chain skips even though a releasable
      # fix was just merged. Analyzing the branch tip makes the verdict immune to that race; the
      # tip only ever differs by those [skip ci] bump commits. This also covers the
      # workflow_dispatch re-run case above: ref: main always resolves to the CURRENT tip
      # regardless of which run triggered this job, instead of staying pinned to a stale
      # github.sha that can already be arbitrarily far behind main by the time this job runs.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - id: semrel
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No release needed for this push
        if: steps.semrel.outputs.new_release_published != 'true'
        run: |
          echo "No releasable commits since the last tag (e.g. docs/ci/chore-only) - this is the expected, common case with Conventional Commits, not a failure. docker/trivy/semantic-release below skip themselves via needs.get-version.outputs.published." | tee -a "$GITHUB_STEP_SUMMARY"

  docker:
    # One native runner per platform instead of a single QEMU-emulated multi-platform build -
    # ubuntu-24.04-arm is a real arm64 GitHub-hosted runner (free for public repos), so that
    # leg runs at native speed (same pattern as homelab-autodoc/UnifiProtectDashboard). Each
    # leg pushes by digest only; docker-manifest-merge below writes the actual
    # :latest/:$NEXT_VERSION tags. Runs after semantic-release (not before, see that job) -
    # a build/push failure here never leaves an orphaned, un-tagged GHCR image blocking
    # every future release via the duplicate-tag guard below.
    needs: [get-version, semantic-release]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.get-version.outputs.published == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      # ref: main to match get-version's analysis target - the artifact stamped with the next
      # version must be built from the same tree that version was computed for, not from an
      # event SHA that may be a [skip ci] bump behind it.
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard against duplicate tag
        run: |
          if docker manifest inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" >/dev/null 2>&1; then
            echo "::error::registry tag ${{ env.NEXT_VERSION }} already exists (version race with a parallel run). Do NOT retry this run; wait for it to finish, then push again to produce a fresh version."
            exit 1
          fi
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest-merge:
    needs: [get-version, docker]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" \
            -t "${{ env.IMAGE }}:latest" \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)
      - name: Inspect the pushed manifest
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}"

  trivy:
    needs: [get-version, docker-manifest-merge]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

  semantic-release:
    # Runs before docker (see that job's comment) - the real tag/release must exist before
    # anything is published under that version.
    needs: [get-version]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # ref: main for the same reason as get-version's checkout: the real release must be cut
      # from the branch tip get-version analyzed, or the "behind the remote" guard trips on the
      # event SHA whenever a [skip ci] bump raced in. The retry below still covers a push landing
      # DURING this job (i.e. after this checkout, before this job's own push).
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - id: semrel
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      # Retry once for the narrow window where an out-of-band push to main landed
      # between this job's checkout and its own push (mirrors studylife's own
      # ci-cd.yml - see the identical comment there).
      - if: steps.semrel.outcome == 'failure'
        name: "Diagnose before retrying (expected: an out-of-band push landed since checkout)"
        run: |
          git fetch origin main
          BEFORE_SHA="$(git rev-parse HEAD)"
          AFTER_SHA="$(git rev-parse origin/main)"
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "origin/main moved since checkout ($BEFORE_SHA -> $AFTER_SHA) - this matches the out-of-band-push race this retry is designed for."
          else
            echo "::warning::origin/main did NOT move since checkout - this failure is likely NOT the expected out-of-band-push race. Retrying anyway, but check the semantic-release log above for the real cause before assuming this is just a race."
          fi
          git checkout -B main origin/main
      - if: steps.semrel.outcome == 'failure'
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog@7.0.0
            @semantic-release/git@11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
