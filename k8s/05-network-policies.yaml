# Default-deny in BOTH directions as the baseline (default-deny-ingress and
# default-deny-egress), with every allowed flow spelled out as its own policy: cluster DNS in
# allow-dns, the app pod's three outbound dependencies in studylife-ai-egress (Qdrant,
# StudyLife, the LLM provider over HTTPS), and the inbound paths below. Bootstrap-only, NOT
# Flux-managed - same RBAC reasoning as k8s/00-namespace.yaml/k8s/02-secret.yaml
# (kustomize-controller's ClusterRole has no "networkpolicies" permission).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: studylife-ai
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: studylife-ai
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# studylife-scale has no default-deny egress (see that namespace's own k8s/12-network-
# policies.yaml header comment), so studylife-web can already reach out cross-namespace by
# default - this rule is the only side that needs to explicitly allow anything.
#
# Audit O6-ai phase B (2026-08-26, see docs/decisions.md): this rule now covers ONLY
# chat/agent proxying (port 8000) - studylife-web's other reason for calling this app,
# register-key/revoke-key, moved to allow-studylife-to-internal-port (port 8001) below once
# /internal/* stopped being served on 8000 at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-studylife-web-to-app
  namespace: studylife-ai
spec:
  podSelector: { matchLabels: { app: studylife-ai } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: studylife-scale } }
          podSelector: { matchLabels: { app: studylife-web } }
      ports:
        - { protocol: TCP, port: 8000 }
---
# Metrics dashboard (see docs/decisions.md "Metrics dashboard"): studylife's own Prometheus
# (studylife repo's k8s/14-prometheus.yaml, "studylife-ai" scrape job) lives in a different
# namespace/cluster-app entirely, so it needs its own explicit ingress allowance on the same
# port 8000 the app already serves /metrics from - the default-deny-ingress baseline above
# would otherwise block the scrape just like it blocks everything else not explicitly allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-app
  namespace: studylife-ai
spec:
  podSelector: { matchLabels: { app: studylife-ai } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
          podSelector: { matchLabels: { app: prometheus } }
      ports:
        - { protocol: TCP, port: 8000 }
---
# Audit O6-ai (2026-08-26, see docs/decisions.md "F15/O6-ai: chat model allowlist, metrics
# token gate, /internal port split"): /internal/* (register-key/revoke-key/enrich-capture) is
# served EXCLUSIVELY on its own port (INTERNAL_API_PORT, default 8001 - see 01-config.yaml,
# 04-app.yaml, internal_server.py) - this is the tighter policy that port split exists to
# enable: unlike allow-studylife-web-to-app above (scoped to the whole shared port 8000, which
# also carries /chat and /agent), THIS rule admits only the two pods that actually call
# /internal/* endpoints (register-key/revoke-key from studylife-web, enrich-capture from
# studylife-worker) to port 8001, and nothing else on this port. Phase B (2026-08-26) dropped
# studylife-worker's port-8000 access entirely (its old allow-studylife-worker-to-app rule) -
# enrich-capture was its only reason to reach this app at all, and that call now only ever goes
# to port 8001, covered here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-studylife-to-internal-port
  namespace: studylife-ai
spec:
  podSelector: { matchLabels: { app: studylife-ai } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: studylife-scale } }
          podSelector: { matchLabels: { app: studylife-web } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: studylife-scale } }
          podSelector: { matchLabels: { app: studylife-worker } }
      ports:
        - { protocol: TCP, port: 8001 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-qdrant
  namespace: studylife-ai
spec:
  podSelector: { matchLabels: { app: qdrant } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: studylife-ai } }
      ports:
        - { protocol: TCP, port: 6333 }
---
# Egress for the app pod. Three outbound dependencies, all of them load-bearing:
#
#  1. Qdrant in this same namespace (QDRANT_URL = http://qdrant:6333, k8s/01-config.yaml) -
#     every ingestion write and every RAG retrieval goes here (ingestion/qdrant_store.py).
#  2. StudyLife itself (STUDYLIFE_API_BASE_URL =
#     https://studylife-web.studylife-scale.svc.cluster.local) - the periodic sync job
#     (ingestion/sync.py, visible in this pod's logs as "Sync[note]/[course]/[session]...")
#     and the agent's tool calls (api/agent.py). NetworkPolicy matches the POD port, not the
#     Service port: studylife-scale's studylife-web Service maps 443 -> 8443 and 80 -> 8080,
#     so the HTTPS base URL above lands on container port 8443. 8080 is allowed alongside it
#     so switching the base URL to plain HTTP needs no further policy change.
#  3. Outbound HTTPS to the configured LLM provider. LLM_MODEL/RERANK_MODEL/EMBEDDING_MODEL
#     are all "openai/..." with an empty LLM_API_BASE, i.e. LiteLLM talks to the provider's
#     public API over 443 (llm/client.py, agent/graph.py). The provider is configuration, not
#     a fixed host - enumerating its IPs would break on the next DNS change, so this stays a
#     0.0.0.0/0:443 allowance, the same trade-off claude-queue's api-egress makes.
#
# Deliberately NOT allowed: everything else, including the Kubernetes API (this app never
# talks to it) and any non-443 outbound port. DNS is covered by allow-dns above; kubelet
# probes are not subject to NetworkPolicy (they originate from the node, not a pod).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: studylife-ai-egress
  namespace: studylife-ai
spec:
  podSelector: { matchLabels: { app: studylife-ai } }
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector: { matchLabels: { app: qdrant } }
      ports:
        - { protocol: TCP, port: 6333 }
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: studylife-scale } }
          podSelector: { matchLabels: { app: studylife-web } }
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8443 }
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 443 }
---
# Egress counterpart of the ingress baseline above: a pod in this namespace gets no outbound
# access at all beyond what an explicit policy grants it (allow-dns for cluster DNS, plus the
# per-app egress policy in this file). Until 2026-09-13 allow-dns carried a bare "- {}" rule
# next to its DNS rule, which allowed egress to anywhere - the internet, every other namespace
# and the node network - making the policy a no-op in practice. This baseline replaces it, so
# a pod added here later is denied by default instead of inheriting that hole.
#
# The Qdrant pod deliberately gets no egress policy of its own: it only answers requests and
# writes to its PVC. The single outbound call it would otherwise make is its optional
# anonymous usage telemetry, which nothing here depends on.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: studylife-ai
spec:
  podSelector: {}
  policyTypes: ["Egress"]
