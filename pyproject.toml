[project]
name = "studylife-ai"
version = "0.1.0"
description = "LLM agent microservice extending StudyLife (Blazor WASM + ASP.NET Core) with RAG, study planning, and agent actions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "litellm>=1.52",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "tiktoken>=0.8",
    # M4 agent (see docs/decisions.md "M4 agent stack"): create_react_agent
    # is deprecated in current LangGraph - create_agent + HumanInTheLoopMiddleware
    # (from the langchain package, not langgraph alone) is the current way to
    # pause a graph before a write-tool executes.
    "langgraph>=1.2",
    "langchain>=1.3",
    "langchain-litellm>=0.7",
    "langgraph-checkpoint-sqlite>=3.1",
    # M4.5 (see docs/decisions.md "Multi-user support"): registered_keys.py's
    # per-user AiApiKey store uses this directly, not just as a transitive
    # dependency of langgraph-checkpoint-sqlite - declared explicitly so it
    # isn't an undeclared import.
    "aiosqlite>=0.20",
    # Metrics dashboard (see docs/decisions.md "Metrics dashboard"): exposes /metrics for the
    # existing self-hosted Prometheus (studylife repo's k8s/14-prometheus.yaml) to scrape -
    # wraps prometheus_client with FastAPI HTTP auto-instrumentation (request rate/latency/
    # status per endpoint) on top of the LLM cost/latency/token counters registered by hand
    # in llm/metrics.py.
    "prometheus-fastapi-instrumentator>=7.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "ragas>=0.3,<0.4",  # 0.4.3 has a broken import (langchain_community.chat_models.vertexai
    # was removed upstream) - github.com/explodinggradients/ragas/issues/2745
    "langchain-community<0.4",  # ragas 0.3.x's own base.py still does an unconditional
    # `from langchain_community.chat_models.vertexai import ChatVertexAI` - that submodule
    # was removed in langchain-community 0.4.x (split into langchain-google-vertexai);
    # pinning below 0.4 keeps the file ragas expects, without adding an unused GCP dependency.
    # Also used directly in eval/runner.py: ChatLiteLLM wraps our judge model for
    # ragas' LangchainLLMWrapper - the legacy metrics need a BaseRagasLLM, which
    # ragas' own newer llm_factory() does not produce (see runner.py for detail).
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studylife_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["studylife_ai"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is exactly `param: T = Depends(...)` -
# B008 (no function calls in argument defaults) would otherwise flag every
# use of it; this is the standard allowlist FastAPI's own docs recommend.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "litellm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
