services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network, Ollama is reachable by service name,
      # not localhost — overrides the .env default for container-to-container calls.
      LLM_API_BASE: http://ollama:11434
    depends_on:
      - qdrant
      - ollama

  # Vector DB — unused until M2 (RAG ingestion), started here so the local
  # dev environment is consistent from day one.
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  # Local model runtime — lets /chat work with zero API keys out of the box.
  # Pull a model once via: docker compose exec ollama ollama pull llama3.2
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  qdrant_storage:
  ollama_data:
