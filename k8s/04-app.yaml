# The service itself. Image tag is a placeholder ("0.1.0") overwritten by Flux's
# ImageUpdateAutomation the moment the studylife repo's k8s/flux/09-studylife-ai-image-update-
# automation.yaml first reconciles against a real published tag (see docs/decisions.md
# "M5 - Deployment design"). Dockerfile creates "appuser" with an explicit numeric --uid 1000
# (unlike the vendored Qdrant image, see k8s/03-qdrant.yaml) - runAsNonRoot/runAsUser is safe
# here without live inspection, since it's this repo's own Dockerfile, not an opaque third-party
# image.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: studylife-ai-data
  namespace: studylife-ai
spec:
  accessModes: ["ReadWriteOnce"]
  # Longhorn (cross-node-replicated, homelab-infra/cluster/11-longhorn-values.yaml) instead
  # of local-path - agent_checkpoints.db/registered_keys.db survive a node dying instead of
  # needing a Velero restore.
  storageClassName: longhorn
  resources:
    requests: {storage: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studylife-ai
  namespace: studylife-ai
spec:
  replicas: 1
  strategy:
    # Single instance with an RWO volume (registered_keys.db/agent_checkpoints.db are plain
    # SQLite files, not built for concurrent writers) - same reasoning as Qdrant/uptime-kuma.
    type: Recreate
  selector:
    matchLabels: {app: studylife-ai}
  template:
    metadata:
      labels: {app: studylife-ai}
      annotations:
        # Opt-in to homelab-infra's nightly Velero PVC backup: /app/data holds
        # agent_checkpoints.db (LangGraph session state). Borderline-valuable, but the
        # backup costs kilobytes. Crash-consistent copy, accepted like qdrant's.
        backup.velero.io/backup-volumes: data
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # Makes the PVC mount group-writable by UID 1000 on first mount - without this, a
        # freshly-provisioned PersistentVolume is root-owned and the non-root container gets
        # "Permission denied" writing to /app/data (registered_keys.db/agent_checkpoints.db).
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: studylife-ai
          image: ghcr.io/lukislp/studylife-ai:1.17.2 # set by the deploy-bump job (CI) on every release
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            # The two SQLite files on the PVC below are the only persisted state; the image
            # layer is never written to. The two emptyDirs cover what the Python stack still
            # needs to write (see volumeMounts).
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef: {name: studylife-ai-config}
            - secretRef: {name: studylife-ai-secrets}
          # HTTPS listeners for the StudyLife -> studylife-ai hop (src/studylife_ai/tls.py): the
          # public routes on 8443 and /internal/* on 8444, with the cert-manager certificate from
          # 07-tls-certificate.yaml. StudyLife calls these ports and validates the certificate
          # against its internal CA. Removing these two variables is the explicit opt-out back to
          # plain HTTP only.
          env:
            - name: TLS_CERT_FILE
              value: /etc/studylife-ai-tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/studylife-ai-tls/tls.key
          ports:
            - containerPort: 8000
            # Audit O6-ai (2026-08-26, see docs/decisions.md "F15/O6-ai: chat model allowlist,
            # metrics token gate, /internal port split"): /internal/* (register-key/revoke-key/
            # enrich-capture) is served ONLY here, on INTERNAL_API_PORT (studylife-ai-config) - a
            # second uvicorn.Server task in the same process (internal_server.py), not a second
            # container. Lets 05-network-policies.yaml scope ingress on THIS port to just
            # StudyLife's own backend pods, tighter than port 8000 (also reachable by
            # Prometheus for /metrics) - update the placeholder port number below only if
            # INTERNAL_API_PORT is ever overridden away from its default (8001) in
            # studylife-ai-config.
            - containerPort: 8001
            # TLS_PORT / INTERNAL_API_TLS_PORT defaults (config.py): HTTPS for the same two apps.
            # The plain ports above stay for the kubelet probes and Prometheus; StudyLife's
            # backend only uses these two (its AddonTls:RequireHttps refuses http:// URLs).
            - containerPort: 8443
            - containerPort: 8444
          resources:
            requests: {cpu: 100m, memory: 200Mi}
            limits: {cpu: 500m, memory: 512Mi}
          # Both probes set timeoutSeconds explicitly. The Kubernetes default of 1s is too
          # tight for the arm64 Raspberry Pi nodes this runs on: the weakest node sits close
          # to its memory limit, so an ordinary load spike pushes /health past one second,
          # the liveness probe fails failureThreshold times in a row and kubelet restarts a
          # container that was only busy.
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: studylife-ca
              mountPath: /etc/studylife-ca
              readOnly: true
            - name: tls
              mountPath: /etc/studylife-ai-tls
              readOnly: true
            # Python's tempfile module, and tiktoken's BPE download cache, which defaults to
            # a directory under gettempdir() unless TIKTOKEN_CACHE_DIR says otherwise.
            - name: tmp
              mountPath: /tmp
            # $HOME of appuser: the default XDG cache location, where the LLM client stack
            # (litellm/langchain tokenizer data) puts anything it caches on first use. Nothing
            # in there has to survive a restart.
            - name: home
              mountPath: /home/appuser
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: studylife-ai-data}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        - name: home
          emptyDir: {sizeLimit: 128Mi}
        - name: studylife-ca
          configMap: {name: studylife-internal-ca}
        # Written by cert-manager (07-tls-certificate.yaml). A Secret volume follows renewals,
        # and tls.py reloads the files without a restart.
        - name: tls
          secret: {secretName: studylife-ai-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: studylife-ai
  namespace: studylife-ai
spec:
  type: ClusterIP
  selector: {app: studylife-ai}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    # Audit O6-ai: /internal/* on its own port - see the Deployment's containerPort comment
    # above and 05-network-policies.yaml's allow-studylife-to-internal-port.
    - name: internal
      port: 8001
      targetPort: 8001
    # HTTPS for the StudyLife -> studylife-ai hop (tls.py, 07-tls-certificate.yaml). StudyLife's
    # StudyLifeAi__BaseUrl / __InternalBaseUrl point here.
    - name: https
      port: 8443
      targetPort: 8443
    - name: internal-https
      port: 8444
      targetPort: 8444
