# Dedicated namespace, isolated from studylife-scale (see docs/decisions.md "M5 - Deployment
# design"). Pod Security Standards: "restricted" hard-enforced (enforce, warn and audit alike) -
# every workload here runs as a non-root uid, drops all capabilities, uses the RuntimeDefault
# seccomp profile and gets volume ownership via fsGroup instead of a root chown init container
# (the one thing that used to hold this namespace at "baseline"; see k8s/03-qdrant.yaml).
#
# NOT applied via Flux: kustomize-controller's least-privilege ClusterRole (studylife repo's
# k8s/flux/06-reconciler-rbac.yaml) grants no permission on the "namespaces" resource at all -
# only Deployments/ConfigMaps/Services/PVCs. This file is bootstrap-only, applied once by hand
# (kubectl apply -f k8s/00-namespace.yaml), matching studylife's own split between
# Flux-reconciled app manifests and bootstrap-cluster.ps1-applied cluster-level resources.
apiVersion: v1
kind: Namespace
metadata:
  name: studylife-ai
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: studylife-ai
automountServiceAccountToken: false
