# IMPORTANT: the values below are obvious placeholders, publicly visible in this repo - never
# use them like this in a real cluster. For a real deployment, create this Secret out of band
# (kubectl create secret / a secret manager) with real values, then apply everything else here.
# Same convention and same reasoning as studylife's own k8s/01-config-and-secret.yaml.
#
# Bootstrap-only, NOT Flux-managed - kustomize-controller's ClusterRole (studylife repo's
# k8s/flux/06-reconciler-rbac.yaml) grants no permission on the "secrets" resource at all,
# deliberately (see the file's own header comment on least-privilege scoping). Applied once by
# hand (kubectl apply -f k8s/02-secret.yaml) with real values substituted first.
apiVersion: v1
kind: Secret
metadata:
  name: studylife-ai-secrets
  namespace: studylife-ai
type: Opaque
stringData:
  # Read directly by LiteLLM (OPENAI_API_KEY is its standard env var name, not something this
  # app's own config.py parses) - matches local dev (.env.example).
  OPENAI_API_KEY: "sk-REPLACE-ME"
  # MUST match StudyLife's own StudyLifeAi:SharedSecret exactly (see docs/decisions.md "M4.5
  # Multi-user support" - "Auth flow, take two"), or every /chat and /agent request fails with
  # 401. Generate with e.g. `openssl rand -base64 32`.
  STUDYLIFE_SHARED_SECRET: "REPLACE-ME"
