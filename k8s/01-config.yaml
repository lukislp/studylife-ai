# Non-secret runtime configuration. Flux-managed (see k8s/flux-deploy/kustomization.yaml) -
# kustomize-controller's ClusterRole (studylife repo's k8s/flux/06-reconciler-rbac.yaml) grants
# it "configmaps" but deliberately NOT "secrets" - see k8s/02-secret.yaml for why that one stays
# bootstrap-only.
#
# STUDYLIFE_API_BASE_URL carries the REAL value directly (not a placeholder) - this ConfigMap is
# Flux-managed (see k8s/flux-deploy/kustomization.yaml), so a placeholder here would get
# silently reapplied over any manual substitution on every reconcile (found live once already,
# see docs/decisions.md "M5 - Deployment design").
#
# Cluster-internal Service DNS, not the public https://studylife.heim.lan hostname used
# initially: found live that studylife-ai's container has no reason to trust StudyLife's
# internal cert-manager CA (studylife-internal-ca-issuer, a private CA - not publicly trusted),
# so httpx failed every request with CERTIFICATE_VERIFY_FAILED. Plain HTTP, cluster-internal
# only - no TLS hop needed at all for pure pod-to-pod traffic within the same cluster, and no
# certificate to distribute/trust. Needs a matching NetworkPolicy on the studylife-scale side
# (studylife repo's k8s/12-network-policies.yaml) allowing ingress from the studylife-ai
# namespace to studylife-web on port 8080 - StudyLife's own default-deny-ingress otherwise
# blocks it, same as it already blocks every other unlisted source.
#
# Production runs the API-provider LLM/embedding path (no in-cluster Ollama - decided for this
# milestone: Ollama on the cluster's arm64/Raspberry-Pi-class hardware isn't practical, matching
# the same personal-.env override already made for local dev). Only what the deployed service
# actually reads at runtime is listed here - EVAL_JUDGE_MODEL/EVAL_USER_ID are CI-only (the eval
# CLI never runs in this Deployment) and are deliberately omitted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: studylife-ai-config
  namespace: studylife-ai
data:
  APP_NAME: "StudyLife AI"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"

  LLM_MODEL: "openai/gpt-4o-mini"
  LLM_API_BASE: ""
  LLM_REQUEST_TIMEOUT_SECONDS: "60"

  # https on the internal Service port, not the http one - StudyLife's own UseHttpsRedirection
  # middleware forces HTTPS unconditionally, even for internal traffic (found live: the http
  # URL round-tripped through a 307 redirect back to :8443 anyway). STUDYLIFE_CA_CERT_PATH
  # points at the mounted CA cert (k8s/06-studylife-ca.yaml) needed to verify that connection -
  # StudyLife's internal cert-manager CA isn't in any public trust store.
  STUDYLIFE_API_BASE_URL: "https://studylife-web.studylife-scale.svc.cluster.local:8443"
  STUDYLIFE_CA_CERT_PATH: "/etc/studylife-ca/ca.crt"

  EMBEDDING_MODEL: "openai/text-embedding-3-small"

  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION: "studylife_notes"

  CHUNK_SIZE_TOKENS: "500"
  CHUNK_OVERLAP_TOKENS: "75"

  RETRIEVAL_TOP_K: "5"
  RERANK_CANDIDATE_K: "20"
  RERANK_MODEL: "openai/gpt-4o-mini"

  REGISTERED_KEYS_DB_PATH: "/app/data/registered_keys.db"
  AGENT_CHECKPOINT_DB_PATH: "/app/data/agent_checkpoints.db"
