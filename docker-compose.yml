services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network, Qdrant is reachable by service name, not
      # localhost — overrides the .env default for container-to-container calls.
      QDRANT_URL: http://qdrant:6333
      # Same translation for Ollama, but opt-in only: a *completely unset*
      # LLM_API_BASE falls back to the container-reachable Ollama hostname (the
      # zero-API-key default path); an LLM_API_BASE already set in .env -
      # including set to an empty string, e.g. to use an API provider like
      # OpenAI - passes through untouched. `${VAR-default}` (no colon) is the
      # form that distinguishes "unset" from "set to empty", unlike
      # `${VAR:-default}` - the colon form previously forced every
      # API-provider .env onto Ollama's URL instead.
      LLM_API_BASE: ${LLM_API_BASE-http://ollama:11434}
      # M4 agent: without a volume, this SQLite file would live in the
      # container's writable layer and be lost on every `docker compose up
      # --build`/recreate — defeating the whole point of a persistent
      # checkpointer (see docs/decisions.md "M4 agent stack").
      AGENT_CHECKPOINT_DB_PATH: /app/data/agent_checkpoints.db
      # M4.5: same reasoning - the per-user AiApiKey registry must survive
      # container recreates, or every registered user would need to
      # re-generate their key after every deploy.
      REGISTERED_KEYS_DB_PATH: /app/data/registered_keys.db
    volumes:
      - agent_data:/app/data
    depends_on:
      - qdrant
      - ollama

  # Vector DB for note embeddings (M2 ingestion + RAG retrieval).
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  # Local model runtime — lets /chat and ingestion work with zero API keys
  # out of the box. Pull models once via:
  #   docker compose exec ollama ollama pull llama3.2
  #   docker compose exec ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  qdrant_storage:
  ollama_data:
  agent_data:
