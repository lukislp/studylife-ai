name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/lukislp/studylife-ai

jobs:
  changes:
    # Cheap pre-check so `eval` (see below) doesn't run its full ~25-30min, real-money judge-LLM
    # pass on every push - only when a push actually touched something that could affect the RAG
    # pipeline (docs/decisions.md "Eval CI trigger scoped to relevant paths"). No third-party
    # paths-filter action - a plain `git diff` against the pre-push SHA needs no new dependency
    # and is easy to read. `github.event.before` (not just the latest commit) covers multi-commit
    # pushes correctly; a first-push-to-branch `before` of all zeros has no real "before" to diff
    # against, so it defaults to running eval rather than silently skipping it.
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      eval-relevant: ${{ steps.filter.outputs.eval-relevant }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "eval-relevant=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
              | grep -qE '^(src/studylife_ai/(rag|ingestion|llm|agent)/|src/studylife_ai/config\.py|eval/)'; then
            echo "eval-relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "eval-relevant=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    # In the same group as get-version/docker/semantic-release further down, NOT eval/trivy -
    # closes the version-desync race (docs/decisions.md "CI incident") at its actual root:
    # two overlapping pushes' lint/test used to run fully in parallel with no ordering
    # guarantee, so whichever finished first could reach get-version before an earlier push's
    # own release had actually landed, regardless of push order. Deliberately NOT applied
    # workflow-wide (tried that first, reverted) - eval takes 25-30 min and has no interaction
    # with versioning/tagging at all (its Qdrant is a job-scoped ephemeral service container,
    # never shared across jobs or runs), so gating it behind this group only made every push
    # wait out an unrelated eval run for no correctness benefit.
    concurrency:
      group: studylife-ai-release-chain
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.5.8"
          cache-suffix: "lint"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    concurrency:
      group: studylife-ai-release-chain
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.5.8"
          cache-suffix: "test"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run pytest

  eval:
    # Only on push to main, not on every PR commit (docs/decisions.md "M3 eval
    # design") - this job calls a paid judge model, so its cost should stay
    # bounded rather than scale with PR activity. No score thresholds yet
    # either - this just needs to run without raising; the printed scores are
    # for humans to read in the job log until a real baseline justifies gates.
    # Also gated on `changes.eval-relevant` (docs/decisions.md "Eval CI trigger
    # scoped to relevant paths") - a push that only touched docs/k8s/CI itself
    # can't have changed retrieval/generation behavior, so it skips this job
    # entirely instead of burning ~25-30min and real judge-LLM cost for nothing.
    needs: [changes]
    if: github.event_name == 'push' && needs.changes.outputs.eval-relevant == 'true'
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    env:
      QDRANT_URL: http://localhost:6333
      QDRANT_COLLECTION: studylife_notes_ci
      # No local Ollama in CI, so both generation and embeddings use OpenAI
      # here too - the same judge account/key, see docs/decisions.md.
      LLM_MODEL: openai/gpt-4o-mini
      # LLM_API_BASE must be cleared: Settings defaults it to Ollama's URL
      # (http://localhost:11434), which would force even this OpenAI model
      # through a custom api_base litellm can't reach in CI.
      LLM_API_BASE: ""
      EMBEDDING_MODEL: openai/text-embedding-3-small
      EVAL_JUDGE_MODEL: openai/gpt-4o-mini
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.5.8"
          cache-suffix: "eval"
      - run: uv python install 3.12
      - run: uv sync --frozen
      # Seeds eval/fixture_notes.jsonl into the empty Qdrant service container
      # above - CI has no real StudyLife instance to ingest from (see
      # src/studylife_ai/eval/fixture.py).
      - run: uv run python -m studylife_ai.eval.seed_fixture
      - run: uv run python -m studylife_ai.eval | tee "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Version / image / release - push to main only (M5, mirrors studylife's
  # own ci-cd.yml pattern: semantic-release drives the version, Flux picks
  # up the resulting GHCR tag via ImagePolicy - see docs/decisions.md).
  # ---------------------------------------------------------------------
  get-version:
    needs: [lint, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: studylife-ai-release-chain
      cancel-in-progress: false
    # @semantic-release/github verifies push/write access as part of its plugin
    # lifecycle even during a dry run - a read-only token fails that check
    # outright. No actual writes happen here regardless: dry_run: true never
    # pushes/tags/releases.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      next_version: ${{ steps.semrel.outputs.new_release_version }}
      published: ${{ steps.semrel.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: semrel
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No release needed for this push
        if: steps.semrel.outputs.new_release_published != 'true'
        run: |
          echo "No releasable commits since the last tag (e.g. docs/ci/chore-only) - this is the expected, common case with Conventional Commits, not a failure. docker/trivy/semantic-release below skip themselves via needs.get-version.outputs.published." | tee -a "$GITHUB_STEP_SUMMARY"

  docker:
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: studylife-ai-release-chain
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard against duplicate tag
        run: |
          if docker manifest inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" >/dev/null 2>&1; then
            echo "::error::registry tag ${{ env.NEXT_VERSION }} already exists (version race with a parallel run). Do NOT retry this run; wait for it to finish, then push again to produce a fresh version."
            exit 1
          fi
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy:
    needs: [get-version, docker]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

  semantic-release:
    needs: [get-version, docker]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: studylife-ai-release-chain
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: semrel
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      # Retry once for the narrow window where an out-of-band push to main landed
      # between this job's checkout and its own push (mirrors studylife's own
      # ci-cd.yml - see the identical comment there).
      - if: steps.semrel.outcome == 'failure'
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - if: steps.semrel.outcome == 'failure'
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
