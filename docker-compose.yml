services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network, Ollama/Qdrant are reachable by service
      # name, not localhost — overrides the .env defaults for
      # container-to-container calls.
      LLM_API_BASE: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
      - ollama

  # Vector DB for note embeddings (M2 ingestion + RAG retrieval).
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  # Local model runtime — lets /chat and ingestion work with zero API keys
  # out of the box. Pull models once via:
  #   docker compose exec ollama ollama pull llama3.2
  #   docker compose exec ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  qdrant_storage:
  ollama_data:
