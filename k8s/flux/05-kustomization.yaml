# Applies EXCLUSIVELY k8s/flux-deploy/ (this repo's curated Flux-managed subset - see that
# folder's own kustomization.yaml for which files and why). No RBAC changes needed on the
# reconciler side (homelab-infra's flux/01-reconciler-rbac.yaml) - the resource kinds used here
# (ConfigMap/PVC/Service/Deployment) are already covered by the existing shared ClusterRole.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: studylife-ai-deploy
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: studylife-ai
  path: ./k8s/flux-deploy
  prune: true
  wait: true
  timeout: 3m
