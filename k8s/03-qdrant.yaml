# In-cluster vector DB (M2 ingestion + RAG retrieval), same image as local docker-compose.yml.
# Single replica, no HA - a personal-scale note corpus has no availability requirement that
# justifies Qdrant's own clustering mode. /livez and /readyz confirmed live against the real
# image (docker-compose's local Qdrant, both 200 OK) - not guessed from docs.
#
# The official image defaults to root (checked live: docker run --entrypoint sh
# qdrant/qdrant:latest -c id), but the Deployment below runs it as uid 1000 regardless: the
# process only needs /qdrant/storage writable, and the pod-level fsGroup guarantees that
# (Kubernetes sets the volume's group ownership on mount). No container in the pod runs as
# root, which is what lets studylife-ai's namespace hard-enforce the "restricted" Pod
# Security Standard.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-storage
  namespace: studylife-ai
spec:
  accessModes: ["ReadWriteOnce"]
  # Longhorn (cross-node-replicated, homelab-infra/cluster/11-longhorn-values.yaml) instead
  # of local-path - the embeddings survive a node dying instead of needing a Velero restore.
  storageClassName: longhorn
  resources:
    requests: { storage: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: studylife-ai
spec:
  replicas: 1
  strategy:
    type: Recreate # single instance with an RWO volume - same reasoning as uptime-kuma in studylife
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
      annotations:
        # Opt-in to homelab-infra's nightly Velero PVC backup (cluster/10-velero-values.yaml
        # there): the embeddings in studylife_notes are re-derivable from Postgres at worst,
        # but a restore from last night beats hours of re-embedding API calls. The copy is
        # crash-consistent (no quiesce hook) - accepted, 7 independent nightly states.
        backup.velero.io/backup-volumes: storage
    spec:
      automountServiceAccountToken: false
      securityContext:
        # fsGroup replaced the former root chown init container: the kubelet sets
        # group ownership on the volume at mount time, and OnRootMismatch skips the
        # recursive walk whenever the volume root already matches (it does - the
        # data has been 1000:1000 since the init-container era). With the last root
        # container gone, the namespace enforces the "restricted" Pod Security
        # Standard (00-namespace.yaml).
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: qdrant
          # Pinned to the exact version that was running as :latest (digest-
          # matched) - a pod reschedule can never silently pull a different
          # release than what the RAG pipeline was validated against.
          image: qdrant/qdrant:v1.19.2
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            # qdrant writes two things outside the storage volume by default
            # (its init-file indicator in the workdir and snapshots) - both
            # redirected onto the volume so a non-root process needs no other
            # writable path. Verified locally: without these, startup panics
            # as uid 1000; with them, /readyz reports all shards ready.
            - name: QDRANT_INIT_FILE_PATH
              value: /qdrant/storage/.qdrant-initialized
            - name: QDRANT__STORAGE__SNAPSHOTS_PATH
              value: /qdrant/storage/snapshots
          ports:
            - containerPort: 6333
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 1Gi }
          # Both probes set timeoutSeconds explicitly. The Kubernetes default of 1s is too
          # tight for the arm64 Raspberry Pi nodes this runs on: the weakest node sits close
          # to its memory limit, so an ordinary load spike (or a vector search holding the
          # runtime busy) pushes the probe past one second, the liveness probe fails
          # failureThreshold times in a row and kubelet restarts a container that was only
          # busy.
          readinessProbe:
            httpGet: { path: /readyz, port: 6333 }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: 6333 }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: qdrant-storage }
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: studylife-ai
spec:
  selector: { app: qdrant }
  ports:
    - port: 6333
      targetPort: 6333
