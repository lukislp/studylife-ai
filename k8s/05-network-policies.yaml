# Same strategy as studylife's own k8s/12-network-policies.yaml: default-deny ingress as a
# baseline, egress stays open (LiteLLM needs to reach whichever API provider is configured,
# without a fixed allowlist). Bootstrap-only, NOT Flux-managed - same RBAC reasoning as
# k8s/00-namespace.yaml/k8s/02-secret.yaml (kustomize-controller's ClusterRole has no
# "networkpolicies" permission).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: studylife-ai
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: studylife-ai
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - {} # egress otherwise unrestricted - this policy only adds an explicit DNS allowance
---
# studylife-scale has no default-deny egress (see that namespace's own k8s/12-network-
# policies.yaml header comment), so studylife-web can already reach out cross-namespace by
# default - this rule is the only side that needs to explicitly allow anything.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-studylife-web-to-app
  namespace: studylife-ai
spec:
  podSelector: { matchLabels: { app: studylife-ai } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: studylife-scale } }
          podSelector: { matchLabels: { app: studylife-web } }
      ports:
        - { protocol: TCP, port: 8000 }
---
# Found live (2026-08-21): studylife-capture's capture-enrichment background task
# (StudyLife.Server's BackgroundTaskService.CaptureEnrichment, running in the studylife-worker
# deployment, NOT studylife-web) calls POST /internal/enrich-capture directly from the worker
# process - every AI feature before this one (chat/agent proxying, key registration) was
# triggered synchronously from a user's own HTTP request and therefore always ran in
# studylife-web, so this is a genuinely new caller identity this policy never anticipated.
# Without this rule, the connection is actively refused (default-deny-ingress above + no
# matching allow rule), which surfaces as a silent, permanent capture-enrichment failure - the
# call never even reaches this app's HTTP layer, so nothing shows up in its own request logs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-studylife-worker-to-app
  namespace: studylife-ai
spec:
  podSelector: { matchLabels: { app: studylife-ai } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: studylife-scale } }
          podSelector: { matchLabels: { app: studylife-worker } }
      ports:
        - { protocol: TCP, port: 8000 }
---
# Metrics dashboard (see docs/decisions.md "Metrics dashboard"): studylife's own Prometheus
# (studylife repo's k8s/14-prometheus.yaml, "studylife-ai" scrape job) lives in a different
# namespace/cluster-app entirely, so it needs its own explicit ingress allowance on the same
# port 8000 the app already serves /metrics from - the default-deny-ingress baseline above
# would otherwise block the scrape just like it blocks everything else not explicitly allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-app
  namespace: studylife-ai
spec:
  podSelector: { matchLabels: { app: studylife-ai } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
          podSelector: { matchLabels: { app: prometheus } }
      ports:
        - { protocol: TCP, port: 8000 }
---
# Audit O6-ai (2026-08-26, see docs/decisions.md "F15/O6-ai: chat model allowlist, metrics
# token gate, /internal port split"): /internal/* (register-key/revoke-key/enrich-capture) is
# ALSO served on its own port now (INTERNAL_API_PORT, default 8001 - see 01-config.yaml,
# 04-app.yaml, internal_server.py) - this is the tighter policy that port split exists to
# enable: unlike allow-studylife-web-to-app/allow-studylife-worker-to-app above (both scoped to
# the whole shared port 8000, which also carries /chat, /agent, and /metrics), THIS rule admits
# only the two pods that actually call /internal/* endpoints (register-key/revoke-key from
# studylife-web, enrich-capture from studylife-worker - see allow-studylife-worker-to-app's own
# comment above) to port 8001, and nothing else on this port. The two 8000 rules above are left
# UNCHANGED (not narrowed) for one transition release, since /internal/* is still also served
# there - see internal_server.py's module docstring.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-studylife-to-internal-port
  namespace: studylife-ai
spec:
  podSelector: { matchLabels: { app: studylife-ai } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: studylife-scale } }
          podSelector: { matchLabels: { app: studylife-web } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: studylife-scale } }
          podSelector: { matchLabels: { app: studylife-worker } }
      ports:
        - { protocol: TCP, port: 8001 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-qdrant
  namespace: studylife-ai
spec:
  podSelector: { matchLabels: { app: qdrant } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: studylife-ai } }
      ports:
        - { protocol: TCP, port: 6333 }
